# ===== Laragon MySQL connection =====
# Change the password below to whatever you set in your MySQL root account.
# (Your terminal showed root needs a password now, so it's probably not blank anymore.)
spring.datasource.url=jdbc:mysql://localhost:3306/ccs_pairing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password= 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-create/update tables from the entities below
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
